<!DOCTYPE html>
<html>
<body>
  <input id="dist" placeholder="distance" value="10"><br>
  <input id="dur" placeholder="duration" value="2"><br>
  <button onclick="test()">Test</button>
  <p id="result"></p>
  <script>
    var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzQvTXdBhn_B1dpiO0-OmpSkIMJ2JGPF8WPPc_pB3fwVfv22nPOsXM5UBstndc-542TKA/exec"; // ⚠️ replace
    function test() {
      fetch(WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "calculate", distance: 10, durationHours: 2, tolls: 0, waitingHours: 0, returnEmpty: false }),
        headers: {'Content-Type': 'application/json'}
      })
      .then(r => r.json())
      .then(quote => document.getElementById('result').innerText = quote)
      .catch(err => document.getElementById('result').innerText = "Error: " + err);
    }
  </script>
</body>
</html>
